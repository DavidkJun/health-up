# Compose stack for NestJS + PostgreSQL 15.
#
# Host ports are parameterized so you can run dev and main side by side, e.g.:
#   APP_PORT=3001 DB_PORT=5433 docker compose up -d
#
# Prisma: set DATABASE_URL in your .env (or export) to point at the db service
# on the internal Docker network (hostname "db", port 5432), for example:
#   DATABASE_URL=postgresql://postgres:yourpassword@db:5432/healthup?schema=public
# Match POSTGRES_USER, POSTGRES_PASSWORD, and POSTGRES_DB with that URL.

services:
  db:
    image: postgres:15-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
      POSTGRES_DB: ${POSTGRES_DB:-healthup}
    ports:
      - "${DB_PORT:-5432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-postgres} -d ${POSTGRES_DB:-healthup}"]
      interval: 5s
      timeout: 5s
      retries: 5

  app:
    image: ${APP_IMAGE:?Set APP_IMAGE to your GHCR image, e.g. ghcr.io/org/repo:tag}
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    ports:
      - "${APP_PORT:-3000}:3000"
    env_file:
      - .env
    environment:
      NODE_ENV: production
      PORT: "3000"

volumes:
  postgres_data:
